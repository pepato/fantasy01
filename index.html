<script>
    const SHEET_ID = '1yKMR0kwBxOljcdl9gQvK5KYOhsZPGC0ZsuZwxaIlr9s';
    
    async function init() {
        const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json`;
        
        try {
            const response = await fetch(url);
            const text = await response.text();
            const json = JSON.parse(text.substring(47).slice(0, -2));
            const rows = json.table.rows;

            // Ora saltiamo solo la riga 0 (le intestazioni)
            // La mappatura segue: A=0(ID), B=1(Nome), C=2(Soprannome), ecc.
            characters = rows.slice(1).map((row) => {
                const c = row.c;
                const v = (i) => (c && c[i] && c[i].v !== null) ? c[i].v : "";

                return {
                    id: v(0), // Campo ID dalla Colonna A
                    nome: v(1),
                    soprannome: v(2),
                    stirpe: v(3),
                    professione: v(4),
                    eta: v(5),
                    orgoglio: v(6),
                    segreto: v(7),
                    background: v(8),
                    ritratto: v(9),
                    volonta: v(10),
                    esperienza: v(11),
                    reputazione: v(12),
                    doteStirpe: v(13),
                    sentiero: v(14),
                    dotiGen: [v(15), v(16), v(17)].filter(x => x),
                    forza: v(18),
                    agilita: v(19),
                    acume: v(20),
                    empatia: v(21),
                    abilita: {
                        "Artigianato": v(22), "Mischia": v(23), "Resistenza": v(24), "Vigore": v(25),
                        "Furtività": v(26), "Mira": v(27), "Movimento": v(28), "Rapidità": v(29),
                        "Erudizione": v(30), "Intuito": v(31), "Percezione": v(32), "Sopravvivenza": v(33),
                        "Addestramento": v(34), "Esibizione": v(35), "Guarigione": v(36), "Persuasione": v(37)
                    }
                };
            }).filter(char => char.nome !== "");

            renderMaster();
            document.getElementById('loader').style.display = 'none';
        } catch (e) {
            document.getElementById('loader').innerHTML = "Errore nel caricamento dei dati.";
            console.error(e);
        }
    }

    function renderMaster() {
        const list = document.getElementById('master-list');
        list.innerHTML = characters.map(c => `
            <div class="char-card" onclick="showDetail('${c.id}')">
                <h2>${c.nome}</h2>
                <p>${c.soprannome}</p>
                <div style="margin-top:10px; color:var(--teal)">${c.stirpe} ${c.professione}</div>
            </div>
        `).join('');
    }

    function showDetail(id) {
        const c = characters.find(x => x.id == id);
        // ... (il resto della funzione showDetail rimane identico al precedente)
    }
</script>

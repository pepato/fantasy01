<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forbidden Lands - Character Hub</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎲</text></svg>">
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts -->
    <!-- Qui caricheremo il font nel CSS con @import come concordato -->
</head>
<body>

    <div class="container">
        <!-- COLONNA SINISTRA: Elenco e Scheda -->
        <main class="left-panel">
            <h1>Forbidden Lands Hub</h1>
            
            <!-- Questo div sarà popolato dal JS con l'elenco dei personaggi -->
            <section id="character-list" class="grid-list"></section>

            <!-- Questo div mostrerà la scheda dettagliata dopo il click -->
            <section id="character-sheet"></section>        
        </main>

        <!-- COLONNA DESTRA: Log dei Dadi -->
        <aside class="right-panel">
            <h2>Dice Vault</h2>
            <button onclick="clearLog()" class="btn-clear">Pulisci Log</button>


            <div class="dice-modifier">
                <label for="extra-dice">Dadi Extra (Equip/Aiuto):</label>
                <input type="number" id="extra-dice" value="0" min="0" max="10">
            </div>
            
            <div id="dice-log">

                <p class="placeholder">Seleziona un'abilità per lanciare i dadi</p>
            </div>
        </aside>
    </div>

    <!-- LIBRERIE -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <!-- IL TUO SCRIPT -->
    <script src="script.js"></script>
    <script src="visual.js"></script>
</body>
</html>

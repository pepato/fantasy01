<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forbidden Lands - Archivio Personaggi</title>
    <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=IM+Fell+DW+Pica&family=Special+Elite&display=swap" rel="stylesheet">
    <style>
        :root {
            --dark-green: #1b261d; --blood-red: #660000; --brown: #3d2b1f;
            --teal: #2d5a5a; --parchment: #d9cbb3; --ink: #1a1a1a; --gold: #b08d57;
        }
        body {
            background-color: #0d0d0d; color: var(--ink);
            font-family: 'IM Fell DW Pica', serif; margin: 0; padding: 20px;
        }
        .container { max-width: 1000px; margin: 0 auto; }
        header { text-align: center; color: var(--gold); border-bottom: 2px solid var(--blood-red); padding-bottom: 20px; margin-bottom: 40px; }
        h1 { font-family: 'IM Fell English SC', serif; text-transform: uppercase; margin: 0; }
        
        /* Vista Master */
        #master-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .char-card {
            background: var(--parchment); border: 4px solid var(--brown); padding: 20px;
            cursor: pointer; transition: 0.3s; box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }
        .char-card:hover { transform: translateY(-5px); border-color: var(--teal); }
        .char-card h2 { margin: 0; color: var(--blood-red); font-family: 'IM Fell English SC'; }

        /* Vista Detail */
        #detail-view { display: none; background: var(--parchment); border: 10px solid var(--brown); padding: 30px; box-shadow: 0 0 50px black; }
        .back-btn { background: var(--blood-red); color: white; border: none; padding: 10px 20px; cursor: pointer; font-family: 'IM Fell English SC'; margin-bottom: 20px; }
        
        .attr-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; background: var(--dark-green); padding: 15px; margin: 20px 0; }
        .attr-box { text-align: center; color: white; }
        .attr-label { display: block; font-size: 0.7rem; color: var(--gold); text-transform: uppercase; }
        .attr-val { font-size: 2rem; font-family: 'Special Elite'; }

        .box { border: 1px solid var(--brown); padding: 15px; margin-bottom: 15px; }
        .skill-item { display: flex; justify-content: space-between; border-bottom: 1px dotted #888; font-family: 'Special Elite'; font-size: 0.9rem; }
        
        .loading { text-align: center; color: var(--gold); font-size: 1.5rem; padding: 50px; }
        .error-msg { color: #ff4444; text-align: center; background: rgba(0,0,0,0.5); padding: 20px; border: 1px solid red; }
    </style>
</head>
<body>

<div class="container">
    <header id="main-header">
        <h1>Forbidden Lands</h1>
        <p>Cronache della Terra Proibita</p>
    </header>

    <div id="loader" class="loading">Invocazione degli eroi in corso...</div>
    <div id="error" class="error-msg" style="display:none"></div>

    <div id="master-list"></div>

    <div id="detail-view">
        <button class="back-btn" onclick="showMaster()">← Torna all'elenco</button>
        <div id="sheet-content"></div>
    </div>
</div>

<script>
    const SHEET_ID = '1yKMR0kwBxOljcdl9gQvK5KYOhsZPGC0ZsuZwxaIlr9s';
    
    async function init() {
        // Usiamo un URL più generico che pesca la prima tab se il nome fallisce
        const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json`;
        // https://docs.google.com/spreadsheets/d/1yKMR0kwBxOljcdl9gQvK5KYOhsZPGC0ZsuZwxaIlr9s/edit?usp=sharing
        
        try {
            const response = await fetch(url);
            const text = await response.text();
            const json = JSON.parse(text.substring(47).slice(0, -2));
            const data = json.table.rows;

            if (!data || data.length < 3) {
                throw new Error("Nessun dato trovato. Assicurati che ci siano personaggi dalla riga 3 in poi.");
            }

            // Mappatura robusta
            characters = data.slice(2).map((row, index) => {
                const c = row.c;
                const getV = (idx) => (c[idx] && c[idx].v !== null) ? c[idx].v : "";

                return {
                    id: index,
                    nome: getV(0) || "Senza Nome",
                    soprannome: getV(1),
                    stirpe: getV(2),
                    professione: getV(3),
                    eta: getV(4),
                    orgoglio: getV(5),
                    segreto: getV(6),
                    background: getV(7),
                    ritratto: getV(8) || "https://via.placeholder.com/300x400?text=Ritratto",
                    volonta: getV(9) || 0,
                    esperienza: getV(10) || 0,
                    reputazione: getV(11) || 0,
                    forza: getV(17) || 0,
                    agilita: getV(18) || 0,
                    acume: getV(19) || 0,
                    empatia: getV(20) || 0,
                    abilita: {
                        "Artigianato": getV(21), "Mischia": getV(22), "Resistenza": getV(23), "Vigore": getV(24),
                        "Furtività": getV(25), "Mira": getV(26), "Movimento": getV(27), "Rapidità": getV(28),
                        "Erudizione": getV(29), "Intuito": getV(30), "Percezione": getV(31), "Sopravvivenza": getV(32)
                    }
                };
            }).filter(char => char.nome !== "Senza Nome"); // Filtra righe vuote

            renderMaster();
            document.getElementById('loader').style.display = 'none';
        } catch (e) {
            document.getElementById('loader').style.display = 'none';
            const errDiv = document.getElementById('error');
            errDiv.style.display = 'block';
            errDiv.innerHTML = `<strong>Errore Critico:</strong> ${e.message}<br><small>Verifica che il foglio sia 'Pubblicato sul Web' e l'ID sia corretto.</small>`;
        }
    }

    function renderMaster() {
        const list = document.getElementById('master-list');
        list.innerHTML = characters.map(c => `
            <div class="char-card" onclick="showDetail(${c.id})">
                <h2>${c.nome}</h2>
                <p style="font-family:'IM Fell English SC'">${c.soprannome}</p>
                <div style="margin-top:10px; color:var(--teal)">${c.stirpe} ${c.professione}</div>
            </div>
        `).join('');
    }

    function showDetail(id) {
        const c = characters.find(x => x.id === id);
        const content = document.getElementById('sheet-content');
        
        const skillHtml = Object.entries(c.abilita)
            .filter(([_, v]) => v > 0)
            .map(([n, v]) => `<div class="skill-item"><span>${n}</span><span>${v}</span></div>`)
            .join('');

        content.innerHTML = `
            <h1 style="color:var(--blood-red)">${c.nome}</h1>
            <h3 style="margin-top:-15px; font-style:italic">${c.soprannome}</h3>
            
            <div class="attr-grid">
                <div class="attr-box"><span class="attr-label">Forza</span><span class="attr-val">${c.forza}</span></div>
                <div class="attr-box"><span class="attr-label">Agilità</span><span class="attr-val">${c.agilita}</span></div>
                <div class="attr-box"><span class="attr-label">Acume</span><span class="attr-val">${c.acume}</span></div>
                <div class="attr-box"><span class="attr-label">Empatia</span><span class="attr-val">${c.empatia}</span></div>
            </div>

            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:20px;">
                <div>
                    <div class="box"><h4>Dati</h4>
                        Stirpe: ${c.stirpe}<br>Professione: ${c.professione}<br>Età: ${c.eta}
                    </div>
                    <div class="box"><h4>Abilità</h4>${skillHtml || 'Nessuna'}</div>
                </div>
                <div>
                    <img src="${c.ritratto}" style="width:100%; border:3px solid var(--brown);">
                    <div class="box" style="margin-top:10px"><h4>Orgoglio</h4>${c.orgoglio}</div>
                </div>
            </div>
        `;

        document.getElementById('master-list').style.display = 'none';
        document.getElementById('main-header').style.display = 'none';
        document.getElementById('detail-view').style.display = 'block';
    }

    function showMaster() {
        document.getElementById('detail-view').style.display = 'none';
        document.getElementById('master-list').style.display = 'grid';
        document.getElementById('main-header').style.display = 'block';
    }

    window.onload = init;
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FORBIDDEN LANDS - Compendio Eroi</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    
<div class="container">
    <header id="main-header">
        <h1>Forbidden Lands</h1>
        <p>— Registro degli Avventurieri —</p>
    </header>
<!-- COMPARISON -->
    <div id="comparison-section" class="box" style="display: none; margin: 20px; border: 2px solid var(--brown);">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
        <h3 style="margin: 0; color: var(--blood-red);">⚔️ Analisi Compagnia</h3>
        <button onclick="toggleComparison()" style="cursor: pointer; background: none; border: 1px solid var(--brown); font-family: inherit;">Chiudi</button>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px;">
        <select id="select-char-1" onchange="updateComparison()" style="padding: 8px; background: var(--parchment); font-family: inherit;"></select>
        <select id="select-char-2" onchange="updateComparison()" style="padding: 8px; background: var(--parchment); font-family: inherit;"></select>
    </div>

    <div style="background: rgba(255,255,255,0.6); border-radius: 8px; padding: 15px; position: relative;">
        <canvas id="comparisonChart"></canvas>
    </div>
</div>

<div style="text-align: center; margin: 20px 0;">
    <button onclick="toggleComparison()" class="char-card" style="display: inline-block; padding: 10px 25px; cursor: pointer; font-weight: bold;">
        CONFRONTA EROI
    </button>
</div>
<!-- FINE COMPARISON -->
    
    <div id="loader" class="loading">Invocando i dati dalle Terre Proibite...</div>

    <div id="master-list"></div>
    

    <div id="detail-view">
        <button class="back-btn" onclick="showMaster()">← Chiudi Pergamena</button>
        <div id="sheet-content"></div>
    </div>
</div>

<!-- CHIAMATA JAVASCRIPT -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>

<script src="script.js"></script>
    


</body>
</html>

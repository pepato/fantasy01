<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forbidden Lands - Archivio Avventurieri</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Metamorphous&family=Quattrocento:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --parchment: #f4e4bc;
            --leather: #3d2b1f;
            --gold: #c5a059;
            --ink: #1a1a1a;
            --blood: #8b0000;
        }

        body {
            background-color: #121212;
            color: var(--ink);
            font-family: 'Quattrocento', serif;
            margin: 0; padding: 20px;
        }

        header { text-align: center; color: var(--gold); margin-bottom: 40px; }
        header h1 { font-family: 'Cinzel', serif; font-size: 3rem; margin: 0; }

        /* GRIGLIA PRINCIPALE */
        #master-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .char-card {
            background: var(--parchment);
            border: 5px solid var(--leather);
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .char-card:hover { transform: translateY(-10px); border-color: var(--gold); }
        .char-card h2 { font-family: 'Cinzel', serif; margin: 5px 0; color: var(--blood); border-bottom: 2px solid var(--leather); }
        
        /* OVERLAY DETTAGLIO */
        #detail-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 1000;
            overflow-y: auto;
        }

        .sheet {
            background: var(--parchment);
            width: 95%; max-width: 900px;
            margin: 40px auto;
            padding: 30px;
            border: 12px solid var(--leather);
            box-shadow: 0 0 50px black;
        }

        .close-btn { float: right; font-size: 2.5rem; cursor: pointer; font-family: 'Cinzel'; }

        /* SEZIONI SCHEDA */
        .grid-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin: 20px 0; }
        .stat-box { background: rgba(0,0,0,0.05); border: 1px solid var(--leather); text-align: center; padding: 10px; }
        .stat-label { display: block; font-size: 0.7rem; text-transform: uppercase; font-weight: bold; }
        .stat-val { font-size: 1.8rem; font-family: 'Metamorphous'; color: var(--blood); }

        .info-section { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin-top: 20px; }
        .box { border-top: 2px solid var(--leather); padding-top: 10px; }
        .box h4 { font-family: 'Cinzel'; margin: 0 0 10px 0; color: var(--leather); }

        .loading { color: var(--gold); text-align: center; padding: 100px; font-size: 1.5rem; font-family: 'Cinzel'; }
    </style>
</head>
<body>

<header>
    <h1>Forbidden Lands</h1>
    <p>Compendio degli Eroi della Landa</p>
</header>

<div id="loader" class="loading">Srotolando le pergamene dei dati...</div>
<div id="master-grid"></div>

<div id="detail-overlay">
    <div class="sheet">
        <span class="close-btn" onclick="closeSheet()">&times;</span>
        <div id="sheet-content"></div>
    </div>
</div>

<script>
    const SHEET_ID = '1yKMR0kwBxOljcdl9gQvK5KYOhsZPGC0ZsuZwxaIlr9s';
    const TAB_NAME = 'Personaggio'; // Cambia in 'Foglio1' se necessario

    let characters = [];

    async function loadData() {
        const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${TAB_NAME}`;
        
        try {
            const response = await fetch(url);
            const text = await response.text();
            const json = JSON.parse(text.substring(47).slice(0, -2));
            const rows = json.table.rows;

            // Mappatura delle colonne basata sulla tua nuova struttura
            characters = rows.map((row, i) => {
                const c = row.c;
                return {
                    id: i,
                    nome: c[1] ? c[1].v : "Eroe Ignoto",
                    stirpe: c[2] ? c[2].v : "-",
                    professione: c[3] ? c[3].v : "-",
                    eta: c[4] ? c[4].v : "-",
                    forza: c[5] ? c[5].v : 0,
                    agilita: c[6] ? c[6].v : 0,
                    acume: c[7] ? c[7].v : 0,
                    empatia: c[8] ? c[8].v : 0,
                    orgoglio: c[9] ? c[9].v : "-",
                    segreto: c[10] ? c[10].v : "-",
                    reputazione: c[11] ? c[11].v : 0,
                    volonta: c[12] ? c[12].v : 0,
                    esperto: c[13] ? c[13].v : "-"
                };
            });

            renderGrid();
            document.getElementById('loader').style.display = 'none';
        } catch (e) {
            document.getElementById('loader').innerHTML = "Errore: Assicurati che il foglio sia 'Pubblicato sul Web'";
        }
    }

    function renderGrid() {
        const grid = document.getElementById('master-grid');
        grid.innerHTML = characters.map(c => `
            <div class="char-card" onclick="openSheet(${c.id})">
                <div>
                    <h2>${c.nome}</h2>
                    <p><strong>${c.stirpe}</strong> - ${c.professione}</p>
                </div>
                <div style="font-size: 0.8rem; font-style: italic; border-top: 1px solid #ccc; padding-top: 5px;">
                    Clicca per i dettagli...
                </div>
            </div>
        `).join('');
    }

    function openSheet(id) {
        const c = characters.find(x => x.id === id);
        const content = document.getElementById('sheet-content');
        
        content.innerHTML = `
            <div style="border-bottom: 4px solid var(--leather); margin-bottom: 20px;">
                <h1 style="font-family: 'Cinzel'; margin: 0; color: var(--blood);">${c.nome}</h1>
                <p style="font-size: 1.2rem;">${c.stirpe} ${c.professione} | Età: ${c.eta} | Reputazione: ${c.reputazione}</p>
            </div>

            <div class="grid-stats">
                <div class="stat-box"><span class="stat-label">Forza</span><span class="stat-val">${c.forza}</span></div>
                <div class="stat-box"><span class="stat-label">Agilità</span><span class="stat-val">${c.agilita}</span></div>
                <div class="stat-box"><span class="stat-label">Acume</span><span class="stat-val">${c.acume}</span></div>
                <div class="stat-box"><span class="stat-label">Empatia</span><span class="stat-val">${c.empatia}</span></div>
            </div>

            <div class="info-section">
                <div class="box">
                    <h4>Orgoglio</h4>
                    <p>"${c.orgoglio}"</p>
                </div>
                <div class="box">
                    <h4>Punti Volontà</h4>
                    <div class="stat-val" style="font-size: 3rem; text-align: center;">${c.volonta}</div>
                </div>
            </div>

            <div class="info-section">
                <div class="box">
                    <h4>Segreto Oscuro</h4>
                    <p>${c.segreto}</p>
                </div>
                <div class="box">
                    <h4>Doti e Talenti</h4>
                    <p>${c.esperto}</p>
                </div>
            </div>
        `;
        document.getElementById('detail-overlay').style.display = 'block';
    }

    function closeSheet() {
        document.getElementById('detail-overlay').style.display = 'none';
    }

    window.onload = loadData;
</script>
</body>
</html>
